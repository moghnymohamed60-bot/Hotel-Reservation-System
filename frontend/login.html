<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Aura Stays</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="fas fa-hotel brand-gold"></i>
        <span>AURA<span class="brand-gold">STAYS</span></span>
      </a>
      <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3 ms-auto">
        <i class="fas fa-arrow-left me-1"></i> Back to Home
      </a>
    </div>
  </nav>

  <div class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-8">
        <div class="auth-card">
          <div class="text-center mb-4">
            <h2 class="fw-bold mb-1">Welcome Back</h2>
            <p class="text-muted small">Sign in to manage your luxury hotel reservations.</p>
          </div>

          <!-- Demo Quick Fill Buttons -->
          <div class="bg-light p-3 rounded-4 mb-4 border">
            <span class="small text-muted fw-bold d-block mb-2 text-uppercase letter-spacing-1">
              <i class="fas fa-key text-warning me-1"></i> Quick Demo Login
            </span>
            <div class="d-flex flex-wrap gap-2">
              <button type="button" id="fill-demo-admin" class="btn btn-outline-dark btn-sm rounded-pill flex-grow-1">
                Admin
              </button>
              <button type="button" id="fill-demo-staff" class="btn btn-outline-dark btn-sm rounded-pill flex-grow-1">
                Staff
              </button>
              <button type="button" id="fill-demo-customer" class="btn btn-outline-dark btn-sm rounded-pill flex-grow-1">
                Customer
              </button>
            </div>
          </div>

          <form id="login-form">
            <div class="mb-3">
              <label class="search-field-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="fas fa-envelope text-muted"></i></span>
                <input type="email" id="login-email" class="form-control py-2" placeholder="name@example.com" required>
              </div>
            </div>

            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="search-field-label mb-0">Password</label>
                <a href="javascript:void(0)" class="small text-warning text-decoration-none" onclick="alert('For testing, default password is: password123')">Forgot?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" id="login-password" class="form-control py-2" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" id="login-submit-btn" class="btn btn-gold w-100 py-2 rounded-pill fw-bold mb-3">
              Sign In <i class="fas fa-arrow-right ms-2"></i>
            </button>

            <div class="text-center small text-muted">
              Don't have an account? <a href="register.html" class="text-warning fw-semibold text-decoration-none">Create Account</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer-custom py-3 mt-auto">
    <div class="container text-center small text-muted">
      &copy; 2026 Aura Stays Hotel Reservation System.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="dist/pages/auth.js"></script>
</body>
</html>
