# ============================================================================
# HOTEL RESERVATION SYSTEM - BASE CONFIGURATION
# ============================================================================

spring.application.name=hotel-reservation-system
server.port=${PORT:8080}

# Active profile: dev by default (uses H2 with schema/data initialization or PostgreSQL if configured)
spring.profiles.active=dev

# Jackson Configuration
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=false

# OpenAPI / Swagger Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a6182c617b12f36c4904d82b4f5c5261dff5efb26c6d235e16f39d59265ff8656be4ee4b31804b9015c7e10887e14e130ce6f6630f9a26cb9f67a21f6448be6}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Seed Data Initialization Mode
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
