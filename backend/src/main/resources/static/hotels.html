<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Hotels | Aura Stays</title>
  <meta name="description" content="Search and filter through luxury hotels, boutique stays and beachfront resorts.">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="fas fa-hotel brand-gold"></i>
        <span>AURA<span class="brand-gold">STAYS</span></span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="hotels.html">Explore Hotels</a></li>
        </ul>
        <ul class="navbar-nav ms-auto align-items-lg-center" id="auth-nav-items">
          <!-- Auth items -->
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page Header -->
  <div class="bg-white border-bottom py-4">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
      <div>
        <h2 class="fw-bold mb-1">Explore Properties</h2>
        <p class="text-muted small mb-0" id="hotels-result-count">Loading luxury properties...</p>
      </div>
      <div class="d-flex align-items-center gap-2">
        <label class="small text-muted text-nowrap">Sort By:</label>
        <select id="sort-by-select" class="form-select form-select-sm" style="width: 190px;">
          <option value="id-asc">Featured</option>
          <option value="starRating-desc">Star Rating (High to Low)</option>
          <option value="name-asc">Name (A to Z)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Main Content Layout -->
  <div class="container py-5">
    <div class="row">
      <!-- Filter Sidebar -->
      <aside class="col-lg-3 mb-4">
        <div class="card border-0 shadow-sm rounded-4 p-4 sticky-top" style="top: 90px;">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0"><i class="fas fa-sliders-h text-warning me-2"></i>Filters</h5>
            <button type="button" id="filter-reset-btn" class="btn btn-link text-decoration-none btn-sm p-0 text-muted">Reset</button>
          </div>
          <form id="filter-form">
            <div class="mb-3">
              <label class="search-field-label">Search Name</label>
              <input type="text" id="filter-search-name" class="form-control form-control-sm" placeholder="e.g. Palace, Grand...">
            </div>
            <div class="mb-3">
              <label class="search-field-label">Destination City</label>
              <select id="filter-city" class="form-select form-select-sm">
                <option value="">All Cities</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="search-field-label">Star Rating</label>
              <select id="filter-rating" class="form-select form-select-sm">
                <option value="">Any Rating</option>
                <option value="5">5 Stars Luxury</option>
                <option value="4">4 Stars & Above</option>
                <option value="3">3 Stars & Above</option>
              </select>
            </div>
            <div class="mb-4">
              <label class="search-field-label">Price Range / Night</label>
              <div class="row g-2">
                <div class="col-6">
                  <input type="number" id="filter-min-price" class="form-control form-control-sm" placeholder="Min $" min="0">
                </div>
                <div class="col-6">
                  <input type="number" id="filter-max-price" class="form-control form-control-sm" placeholder="Max $" min="0">
                </div>
              </div>
            </div>
            <button type="submit" class="btn btn-gold w-100 rounded-pill btn-sm py-2">
              <i class="fas fa-filter me-1"></i> Apply Filters
            </button>
          </form>
        </div>
      </aside>

      <!-- Hotel Cards Grid -->
      <main class="col-lg-9">
        <div class="row" id="hotels-grid">
          <!-- Populated by hotels.js -->
        </div>

        <!-- Pagination -->
        <nav id="hotels-pagination" class="mt-4">
          <!-- Populated by hotels.js -->
        </nav>
      </main>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer-custom py-4 mt-auto">
    <div class="container text-center small text-muted">
      &copy; 2026 Aura Stays Hotel Reservation System.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="dist/pages/hotels.js"></script>
</body>
</html>
