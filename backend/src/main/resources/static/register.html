<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Aura Stays</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="fas fa-hotel brand-gold"></i>
        <span>AURA<span class="brand-gold">STAYS</span></span>
      </a>
      <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3 ms-auto">
        <i class="fas fa-arrow-left me-1"></i> Back to Home
      </a>
    </div>
  </nav>

  <div class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="auth-card">
          <div class="text-center mb-4">
            <h2 class="fw-bold mb-1">Create an Account</h2>
            <p class="text-muted small">Join Aura Stays to unlock instant luxury hotel bookings and member rates.</p>
          </div>

          <form id="register-form">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="search-field-label">First Name</label>
                <input type="text" id="reg-first-name" class="form-control py-2" placeholder="John" required>
              </div>
              <div class="col-md-6">
                <label class="search-field-label">Last Name</label>
                <input type="text" id="reg-last-name" class="form-control py-2" placeholder="Doe" required>
              </div>
              <div class="col-md-6">
                <label class="search-field-label">Email Address</label>
                <input type="email" id="reg-email" class="form-control py-2" placeholder="john.doe@example.com" required>
              </div>
              <div class="col-md-6">
                <label class="search-field-label">Phone Number</label>
                <input type="text" id="reg-phone" class="form-control py-2" placeholder="+1-555-0199" required>
              </div>
              <div class="col-md-6">
                <label class="search-field-label">Password</label>
                <input type="password" id="reg-password" class="form-control py-2" placeholder="••••••••" minlength="6" required>
              </div>
              <div class="col-md-6">
                <label class="search-field-label">Confirm Password</label>
                <input type="password" id="reg-confirm-password" class="form-control py-2" placeholder="••••••••" minlength="6" required>
              </div>
              <div class="col-12 mt-4">
                <button type="submit" id="register-submit-btn" class="btn btn-gold w-100 py-2 rounded-pill fw-bold mb-3">
                  Create Account <i class="fas fa-user-plus ms-2"></i>
                </button>
              </div>
            </div>

            <div class="text-center small text-muted">
              Already have an account? <a href="login.html" class="text-warning fw-semibold text-decoration-none">Sign In</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer-custom py-3 mt-auto">
    <div class="container text-center small text-muted">
      &copy; 2026 Aura Stays Hotel Reservation System.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="dist/pages/auth.js"></script>
</body>
</html>
