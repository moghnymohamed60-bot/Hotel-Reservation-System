<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile | Aura Stays</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="fas fa-hotel brand-gold"></i>
        <span>AURA<span class="brand-gold">STAYS</span></span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="hotels.html">Explore Hotels</a></li>
        </ul>
        <ul class="navbar-nav ms-auto align-items-lg-center" id="auth-nav-items"></ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row g-4">
      <!-- Profile Card Summary -->
      <div class="col-lg-4">
        <div class="card border-0 shadow-sm rounded-4 p-4 text-center">
          <div class="mx-auto mb-3">
            <span class="user-avatar-badge fs-2" style="width: 72px; height: 72px;">U</span>
          </div>
          <h4 class="fw-bold mb-1" id="profile-fullname-header">User Name</h4>
          <p class="text-muted small mb-2" id="profile-email-header">user@example.com</p>
          <div class="d-flex justify-content-center gap-2 mb-4">
            <span class="badge bg-primary-subtle text-primary" id="profile-role-badge">CUSTOMER</span>
            <span id="profile-status-badge"></span>
          </div>

          <div class="border-top pt-3 text-start small text-muted">
            <div class="d-flex justify-content-between mb-2">
              <span>Member Since:</span>
              <strong class="text-dark" id="profile-joined-at">-</strong>
            </div>
            <div class="d-flex justify-content-between">
              <span>Account Security:</span>
              <span class="text-success"><i class="fas fa-shield-alt"></i> JWT Protected</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Edit Profile & Password Forms -->
      <div class="col-lg-8">
        <!-- Personal Info Form -->
        <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
          <h4 class="fw-bold mb-3"><i class="fas fa-user-edit text-warning me-2"></i>Personal Information</h4>
          <form id="profile-update-form">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="search-field-label">First Name</label>
                <input type="text" id="profile-first-name" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="search-field-label">Last Name</label>
                <input type="text" id="profile-last-name" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="search-field-label">Email Address</label>
                <input type="email" id="profile-email" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="search-field-label">Phone Number</label>
                <input type="text" id="profile-phone" class="form-control" required>
              </div>
              <div class="col-12 text-end mt-4">
                <button type="submit" class="btn btn-gold px-4 rounded-pill">
                  <i class="fas fa-save me-1"></i> Update Profile
                </button>
              </div>
            </div>
          </form>
        </div>

        <!-- Password Change Form -->
        <div class="card border-0 shadow-sm rounded-4 p-4">
          <h4 class="fw-bold mb-3"><i class="fas fa-key text-warning me-2"></i>Change Password</h4>
          <form id="password-change-form">
            <div class="row g-3">
              <div class="col-12">
                <label class="search-field-label">Current Password</label>
                <input type="password" id="pwd-current" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="search-field-label">New Password</label>
                <input type="password" id="pwd-new" class="form-control" minlength="6" required>
              </div>
              <div class="col-md-6">
                <label class="search-field-label">Confirm New Password</label>
                <input type="password" id="pwd-confirm" class="form-control" minlength="6" required>
              </div>
              <div class="col-12 text-end mt-4">
                <button type="submit" class="btn btn-outline-secondary px-4 rounded-pill">
                  <i class="fas fa-lock me-1"></i> Update Password
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer-custom py-4 mt-auto">
    <div class="container text-center small text-muted">
      &copy; 2026 Aura Stays Hotel Reservation System.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="dist/pages/profile.js"></script>
</body>
</html>
