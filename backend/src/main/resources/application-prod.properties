# ============================================================================
# HOTEL RESERVATION SYSTEM - PROD PROFILE (PostgreSQL Enterprise Configuration)
# ============================================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hotel_reservation_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Logging
logging.level.com.example.hotelreservation=INFO
logging.level.org.springframework.security=WARN
